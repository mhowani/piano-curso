<title>Juegos de notas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Inter:wght@400;500;600;700&family=Noto+Music&display=swap">
<style>
/* Layout: una columna (máx. 760px): cabecera, ajustes, pestañas de juego y una tarjeta de juego con el pentagrama protagonista.
   Mismos tokens que la app Piano Curso; los 7 colores de nota salen del pentagrama de Rubén. */
:root {
  --bg: #f4f3fb; --surface: #ffffff; --surface-2: #ecebf6; --fg: #1d1b2e; --muted: #67647e; --line: #d9d7ea;
  --accent: #5856d6; --ok: #2fb35a; --bad: #e5484d; --key-white: #ffffff; --key-black: #1d1b2e; --key-line: #2b2940;
  --n0: #ec0f4f; --n1: #f59a00; --n2: #e9d800; --n3: #a9d35b; --n4: #1424e6; --n5: #6f55b5; --n6: #e23ba3;
  --font-display: "Nunito", "SF Pro Rounded", ui-rounded, system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-music: "Noto Music", "Bravura", "Apple Symbols", "Segoe UI Symbol", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13121c; --surface: #1e1d2b; --surface-2: #2a2939; --fg: #f1f0fa; --muted: #a5a2bd; --line: #3a384e;
  --accent: #8e8cf5; --ok: #45d070; --bad: #ff6b6f; --key-white: #f4f3f8; --key-black: #0b0a12; --key-line: #0b0a12;
  --n4: #5b6bff; --n5: #9a82e6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13121c; --surface: #1e1d2b; --surface-2: #2a2939; --fg: #f1f0fa; --muted: #a5a2bd; --line: #3a384e;
  --accent: #8e8cf5; --ok: #45d070; --bad: #ff6b6f; --key-white: #f4f3f8; --key-black: #0b0a12; --key-line: #0b0a12;
  --n4: #5b6bff; --n5: #9a82e6; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2rem; font-weight: 900; }
h2 { font-size: 1.3rem; font-weight: 800; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .74rem; }
main { max-width: 760px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 6px; }
.rainbow { display: flex; gap: 5px; }
.rainbow i { width: 22px; height: 14px; border-radius: 50%; transform: rotate(-18deg); }

/* Ajustes */
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.settings .lab { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 7px 4px; font-weight: 600; font-size: .84rem; white-space: nowrap; }
.seg button.on { background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.12); color: var(--accent); }

/* Pestañas de juegos */
.games { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.games button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: .88rem; }
.games button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stage-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.stage-head h2 { flex: 1 0 auto; }
.stage-head .stats { flex-wrap: wrap; }
.stats { display: flex; gap: 14px; font-weight: 700; font-size: .9rem; }
.stats span { display: inline-flex; gap: 4px; align-items: baseline; }
.stats b { font-family: var(--font-display); font-size: 1.15rem; }
.staffbox { background: var(--surface); border-radius: 14px; display: flex; justify-content: center; }
svg.staff { width: 100%; max-width: 420px; height: auto; display: block; color: var(--fg); }
svg.staff.wide { max-width: none; }
.scroll { overflow-x: auto; }
.prompt { text-align: center; font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; }
.feedback { min-height: 3.2em; text-align: center; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }
.feedback .hint { color: var(--muted); font-weight: 500; font-size: .88rem; }

/* Botones de respuesta */
.answers { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
@media (max-width: 520px) { .answers { grid-template-columns: repeat(4, 1fr); } }
.ans { border: 2px solid color-mix(in srgb, var(--c) 55%, var(--line)); background: color-mix(in srgb, var(--c) 10%, var(--surface)); border-radius: 14px; padding: 10px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .08s; }
.ans:active { transform: scale(.96); }
.ans .dot { width: 14px; height: 10px; border-radius: 50%; background: var(--c); transform: rotate(-18deg); }
.ans b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 900; line-height: 1.1; }
.ans small { color: var(--muted); font-weight: 600; font-size: .74rem; }
.ans.right { background: var(--ok); border-color: var(--ok); color: #fff; } .ans.right small { color: #fff; }
.ans.wrong { background: var(--bad); border-color: var(--bad); color: #fff; animation: shake .3s; } .ans.wrong small { color: #fff; }
.nocolor .ans { --c: var(--muted); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pop { from { transform: scale(.6); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.note-in { animation: pop .18s ease-out; transform-box: fill-box; transform-origin: center; }

.btn { border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 700; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.soft { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); }
.btn.big { padding: 14px 26px; font-size: 1.05rem; border-radius: 14px; }
.center { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.timer { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .2s linear; }
.big-num { font-family: var(--font-display); font-weight: 900; font-size: 3.4rem; line-height: 1; text-align: center; }

/* Teclado */
.kbwrap { overflow-x: auto; padding-bottom: 4px; }
svg.kb { display: block; height: auto; margin: 0 auto; }
svg.kb .w { fill: var(--key-white); stroke: var(--key-line); stroke-width: 1; cursor: pointer; }
svg.kb .b { fill: var(--key-black); cursor: pointer; }
svg.kb .w:hover { fill: color-mix(in srgb, var(--accent) 12%, var(--key-white)); }
svg.kb text { font-family: var(--font-body); font-weight: 700; pointer-events: none; }

/* Coloca */
svg.staff .slot { fill: transparent; cursor: pointer; }
svg.staff .ghost { opacity: 0; pointer-events: none; }
svg.staff .slotg:hover .ghost { opacity: .35; }


/* Colores */
.blob { width: 150px; height: 104px; border-radius: 50%; transform: rotate(-18deg); margin: 10px auto; box-shadow: inset 0 -8px 0 rgba(0,0,0,.12); }
.swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
@media (max-width: 520px) { .swatches { grid-template-columns: repeat(4, 1fr); } }
.sw { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 16px; border: 3px solid transparent; background: var(--c); display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 900; }
.sw.right { border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok); }
.sw.wrong { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad); animation: shake .3s; }

/* Parejas */
.pairs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .pairs { grid-template-columns: repeat(3, 1fr); } }
.card { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 14px; border: 2px solid var(--line); background: var(--surface-2); display: grid; place-items: center; padding: 4px; font-family: var(--font-display); font-weight: 900; font-size: 1.4rem; }
.card.back { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent)); border-color: transparent; color: #fff; }
.card.up { background: var(--surface); }
.card.done { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); border-color: var(--ok); }
.card svg { width: auto; height: 100%; max-width: 100%; }
.card .nm { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.card .nm small { font-size: .72rem; color: var(--muted); font-family: var(--font-body); }

/* Mapa */
.mnemo { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.mnemo div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.mnemo b { display: block; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 600; font-size: .88rem; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 16px; height: 11px; border-radius: 50%; transform: rotate(-18deg); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kbd { font-size: .74rem; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .note-in, .ans.wrong { animation: none; } .ans { transition: none; } }
@media (hover: none) { .kbd { display: none; } }
</style>

<main>
  <header>
    <div class="rainbow" aria-hidden="true"><i style="background:var(--n0)"></i><i style="background:var(--n1)"></i><i style="background:var(--n2)"></i><i style="background:var(--n3)"></i><i style="background:var(--n4)"></i><i style="background:var(--n5)"></i><i style="background:var(--n6)"></i></div>
    <h1>Juegos de notas</h1>
    <p class="muted small" style="margin:0">Aprende a leer las notas en clave de Sol y de Fa, del Do2 al Do6, con los colores de tu pentagrama. Cada juego insiste más en las notas que fallas.</p>
  </header>

  <section class="settings" aria-label="Ajustes">
    <div><div class="lab">Clave</div><div class="seg" id="set-clef"></div></div>
    <div><div class="lab">Notas</div><div class="seg" id="set-level"></div></div>
    <div><div class="lab">Nombres</div><div class="seg" id="set-names"></div></div>
    <div><div class="lab">Colores en la nota</div><div class="seg" id="set-color"></div></div>
    <div><div class="lab">Sonido</div><div class="seg" id="set-sound"></div></div>
  </section>

  <nav class="games" id="games" aria-label="Juegos"></nav>
  <section class="stage" id="stage" aria-live="polite"></section>
</main>

<script>
// ───────── Datos musicales ─────────
// Nota = número diatónico d = octava*7 + letra (C=0). Do4 (central) = 28.
const LET = ["C", "D", "E", "F", "G", "A", "B"];
const ES = ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si"];
const SEMI = [0, 2, 4, 5, 7, 9, 11];
const COLOR = i => `var(--n${i})`;
const CLEFS = {
  sol: { name: "clave de Sol", bottom: 30, full: [28, 42], easy: [30, 38] }, // Do4–Do6 / Mi4–Fa5
  fa:  { name: "clave de Fa",  bottom: 18, full: [14, 28], easy: [18, 26] }  // Do2–Do4 / Sol2–La3
};
const letter = d => ((d % 7) + 7) % 7;
const octave = d => Math.floor(d / 7);

// ───────── Ajustes (se recuerdan en este navegador) ─────────
const store = {
  get(k, def) { try { const v = localStorage.getItem("jn-" + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem("jn-" + k, JSON.stringify(v)); } catch (e) {} }
};
const S = Object.assign({ clef: "sol", level: "easy", names: "both", color: "after", sound: "on", game: "nombra" }, store.get("settings", {}));
const save = () => store.set("settings", S);
let stats = store.get("stats", {});   // { "sol30": [aciertos, fallos] }
let records = store.get("records", {});

function nameOf(d, withOct) {
  const l = letter(d), o = withOct ? octave(d) : "";
  if (S.names === "es") return ES[l] + o;
  if (S.names === "en") return LET[l] + o;
  return `${ES[l]}${o} <span class="muted">(${LET[l]}${o})</span>`;
}
const plainName = d => S.names === "en" ? LET[letter(d)] : ES[letter(d)];

function posDesc(clef, d) {
  const s = d - CLEFS[clef].bottom;
  const fem = n => n + ".ª", masc = n => n + (n === 1 || n === 3 ? ".er" : ".º");
  if (s >= 0 && s <= 8) return s % 2 === 0 ? `en la ${fem(s / 2 + 1)} línea` : `en el ${masc((s + 1) / 2)} espacio`;
  if (s === -1) return "justo debajo del pentagrama";
  if (s === 9) return "justo encima del pentagrama";
  if (s < -1) return s % 2 === 0 ? `en la ${fem(-s / 2)} línea adicional de abajo` : `debajo de la ${fem((-s - 1) / 2)} línea adicional`;
  return s % 2 === 0 ? `en la ${fem((s - 8) / 2)} línea adicional de arriba` : `encima de la ${fem((s - 9) / 2)} línea adicional`;
}

// ───────── Sonido ─────────
let ac = null;
function play(d, dur = 1.4) {
  if (S.sound !== "on") return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const midi = 12 * (octave(d) + 1) + SEMI[letter(d)], f = 440 * Math.pow(2, (midi - 69) / 12), t = ac.currentTime;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(ac.destination);
    [[1, 1], [2, .45], [3, .2], [4, .1], [5, .05]].forEach(([h, a]) => {
      const o = ac.createOscillator(), og = ac.createGain(); o.frequency.value = f * h; og.gain.value = a;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + .05);
    });
  } catch (e) {}
}
function buzz() {
  if (S.sound !== "on") return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle"; o.frequency.value = 140; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .3); } catch (e) {}
}

// ───────── Pentagrama en SVG ─────────
const GAP = 16, H = 210, BOTTOM = 140;           // margen para 2 líneas adicionales arriba (Do6) y abajo (Do2)
const yOf = s => BOTTOM - s * GAP / 2;
function staffSVG({ clef, notes = [], W = 300, cls = "", extra = "" }) {
  const left = 6, right = W - 6;
  let s = `<svg class="staff ${cls}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pentagrama en ${CLEFS[clef].name}">`;
  for (let i = 0; i < 5; i++) s += `<line x1="${left}" x2="${right}" y1="${yOf(i * 2)}" y2="${yOf(i * 2)}" stroke="currentColor" stroke-width="1.4"/>`;
  s += clef === "sol"
    ? `<text x="${left + 6}" y="${BOTTOM + GAP * .55}" font-size="${GAP * 6.2}" fill="currentColor" font-family='"Noto Music","Bravura","Apple Symbols","Segoe UI Symbol",serif'>𝄞</text>`
    : `<text x="${left + 8}" y="${BOTTOM - GAP * 1.05}" font-size="${GAP * 3.6}" fill="currentColor" font-family='"Noto Music","Bravura","Apple Symbols","Segoe UI Symbol",serif'>𝄢</text>`;
  s += extra;
  notes.forEach(n => s += noteSVG(clef, n));
  return s + "</svg>";
}
function ledgers(step, x) {
  let s = "";
  const L = y => `<line x1="${x - GAP * 1.25}" x2="${x + GAP * 1.25}" y1="${y}" y2="${y}" stroke="currentColor" stroke-width="1.4"/>`;
  if (step <= -2) for (let l = -2; l >= step; l -= 2) s += L(yOf(l));
  if (step >= 10) for (let l = 10; l <= step; l += 2) s += L(yOf(l));
  return s;
}
// n = { d, x, colored, label, octNum, anim, cls }
function noteSVG(clef, n) {
  const step = n.d - CLEFS[clef].bottom, x = n.x, y = yOf(step), l = letter(n.d);
  const fill = n.colored ? COLOR(l) : "currentColor";
  let s = `<g class="${n.cls || ""}">` + ledgers(step, x);
  s += `<g class="${n.anim ? "note-in" : ""}">`;
  s += `<ellipse cx="${x}" cy="${y}" rx="${GAP * .8}" ry="${GAP * .55}" fill="${fill}" transform="rotate(-18 ${x} ${y})"/>`;
  s += `<ellipse cx="${x}" cy="${y}" rx="${GAP * .34}" ry="${GAP * .24}" fill="var(--surface)" transform="rotate(42 ${x} ${y})"/>`;
  if (n.octNum && l === 0) s += `<text x="${x}" y="${y + 4.5}" font-size="11" text-anchor="middle" font-weight="700" fill="var(--fg)">${octave(n.d)}</text>`;
  s += `</g>`;
  if (n.label) s += `<text x="${x}" y="${H - 8}" font-size="13" text-anchor="middle" font-weight="700" fill="${COLOR(l)}" style="font-family:var(--font-display)">${n.label}</text>`;
  return s + `</g>`;
}

// ───────── Elegir notas (más peso a las que fallas) ─────────
function pool() {
  const clefs = S.clef === "ambas" ? ["sol", "fa"] : [S.clef];
  const out = [];
  clefs.forEach(c => { const [a, b] = CLEFS[c][S.level]; for (let d = a; d <= b; d++) out.push({ clef: c, d }); });
  return out;
}
let last = null;
function pick() {
  const p = pool().filter(n => !last || n.clef !== last.clef || n.d !== last.d);
  const w = p.map(n => { const [ok, ko] = stats[n.clef + n.d] || [0, 0]; return 1 + 4 * (ko + 1) / (ok + ko + 2) + (ok + ko === 0 ? 1 : 0); });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < p.length; i++) { r -= w[i]; if (r <= 0) return (last = p[i]); }
  return (last = p[p.length - 1]);
}
function record(n, ok) {
  const k = n.clef + n.d, v = stats[k] || [0, 0];
  v[ok ? 0 : 1]++; stats[k] = v; store.set("stats", stats);
}

// ───────── Ajustes (UI) ─────────
const OPTS = {
  clef: [["sol", "Sol 𝄞"], ["fa", "Fa 𝄢"], ["ambas", "Ambas"]],
  level: [["easy", "Dentro"], ["full", "Con líneas extra"]],
  names: [["es", "Do Re Mi"], ["en", "C D E"], ["both", "Ambos"]],
  color: [["always", "Siempre"], ["after", "Al responder"]],
  sound: [["on", "Sí"], ["off", "No"]]
};
function renderSettings() {
  Object.entries(OPTS).forEach(([k, opts]) => {
    const el = document.getElementById("set-" + k);
    el.innerHTML = opts.map(([v, t]) => `<button type="button" id="opt-${k}-${v}" class="${S[k] === v ? "on" : ""}" data-k="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${t}</button>`).join("");
  });
}
document.querySelector(".settings").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  S[b.dataset.k] = b.dataset.v; save(); renderSettings(); startGame();
});

const GAMES = [
  ["nombra", "Nombra la nota"], ["reloj", "Contrarreloj"], ["teclado", "Al teclado"],
  ["coloca", "Coloca la nota"], ["colores", "Colores"], ["parejas", "Parejas"], ["mapa", "Mapa y progreso"]
];
function renderTabs() {
  document.getElementById("games").innerHTML = GAMES.map(([k, t]) => `<button type="button" id="tab-${k}" class="${S.game === k ? "on" : ""}" data-g="${k}">${t}</button>`).join("");
}
document.getElementById("games").addEventListener("click", e => {
  const b = e.target.closest("button[data-g]"); if (!b) return;
  S.game = b.dataset.g; save(); renderTabs(); startGame();
});

const stage = document.getElementById("stage");
let cleanup = () => {};
let keyHandler = null;
document.addEventListener("keydown", e => { if (keyHandler && !e.metaKey && !e.ctrlKey && !e.altKey) keyHandler(e); });

function startGame() {
  cleanup(); cleanup = () => {}; keyHandler = null;
  ({ nombra: gameName, reloj: gameClock, teclado: gameKeys, coloca: gamePlace, colores: gameColors, parejas: gamePairs, mapa: gameMap })[S.game]();
}

function answerButtons(plain) {
  return `<div class="answers">` + ES.map((n, i) =>
    `<button type="button" class="ans" id="ans-${i}" data-l="${i}" style="--c:${plain ? "var(--muted)" : COLOR(i)}"><span class="dot"></span><b>${S.names === "en" ? LET[i] : n}</b>${S.names === "both" ? `<small>${LET[i]}</small>` : ""}</button>`).join("") + `</div>`;
}
const KEYMAP = { c: 0, d: 1, e: 2, f: 3, g: 4, a: 5, b: 6, "1": 0, "2": 1, "3": 2, "4": 3, "5": 4, "6": 5, "7": 6 };

// ───────── Juego 1: Nombra la nota ─────────
function gameName() {
  let cur, locked = false, streak = 0, best = store.get("streak", 0), ok = 0, total = 0;
  stage.innerHTML = `
    <div class="stage-head"><h2>Nombra la nota</h2>
      <div class="stats num"><span>Racha <b id="st-streak">0</b></span><span>Mejor <b id="st-best">${best}</b></span><span>Aciertos <b id="st-acc">–</b></span></div></div>
    <div class="staffbox" id="staff"></div>
    <div class="feedback" id="fb"><span class="muted">¿Qué nota es?</span></div>
    ${answerButtons()}
    <div class="center" id="next" hidden><button class="btn" type="button" id="btn-next">Siguiente</button></div>
    <div class="kbd">Teclado: letras C D E F G A B o números 1 a 7 · Intro para seguir</div>`;
  const fb = stage.querySelector("#fb");
  function show(colored, anim) {
    stage.querySelector("#staff").innerHTML = staffSVG({ clef: cur.clef, notes: [{ d: cur.d, x: 190, colored, anim }] });
  }
  function next() {
    cur = pick(); locked = false;
    stage.querySelectorAll(".ans").forEach(b => b.className = "ans");
    stage.querySelector("#next").hidden = true;
    fb.className = "feedback"; fb.innerHTML = `<span class="muted">¿Qué nota es? (${CLEFS[cur.clef].name})</span>`;
    show(S.color === "always", true);
  }
  function answer(l) {
    if (locked) { if (!stage.querySelector("#next").hidden) next(); return; }
    locked = true; total++;
    const right = letter(cur.d), good = l === right;
    record(cur, good);
    stage.querySelector(`#ans-${right}`).classList.add("right");
    show(true, false); play(cur.d);
    if (good) {
      ok++; streak++; if (streak > best) { best = streak; store.set("streak", best); }
      fb.className = "feedback ok"; fb.innerHTML = `<span>¡Bien! Es ${nameOf(cur.d, true)}</span>`;
      setTimeout(() => { if (locked && cur) next(); }, 800);
    } else {
      streak = 0; buzz();
      stage.querySelector(`#ans-${l}`).classList.add("wrong");
      fb.className = "feedback bad"; fb.innerHTML = `<span>Es ${nameOf(cur.d, true)}</span><span class="hint">Está ${posDesc(cur.clef, cur.d)} en ${CLEFS[cur.clef].name}.</span>`;
      stage.querySelector("#next").hidden = false;
    }
    stage.querySelector("#st-streak").textContent = streak;
    stage.querySelector("#st-best").textContent = best;
    stage.querySelector("#st-acc").textContent = Math.round(100 * ok / total) + " %";
  }
  stage.querySelector(".answers").addEventListener("click", e => { const b = e.target.closest(".ans"); if (b) answer(+b.dataset.l); });
  stage.querySelector("#btn-next").addEventListener("click", next);
  keyHandler = e => {
    if (e.key === "Enter" || e.key === " ") { if (locked && !stage.querySelector("#next").hidden) { e.preventDefault(); next(); } return; }
    const k = KEYMAP[e.key.toLowerCase()]; if (k != null) answer(k);
  };
  cleanup = () => { cur = null; };
  next();
}

// ───────── Juego 2: Contrarreloj (60 s) ─────────
function gameClock() {
  const LEN = 60, recKey = `${S.clef}-${S.level}`;
  let cur, score = 0, misses = 0, t0 = 0, timer = null, running = false, missed = {}, wait = false;
  function intro() {
    running = false;
    const rec = records[recKey];
    stage.innerHTML = `
      <div class="stage-head"><h2>Contrarreloj</h2></div>
      <p style="margin:0">Nombra todas las notas que puedas en <b>60 segundos</b>. Un fallo te hace perder un segundo y medio.</p>
      <p class="muted small" style="margin:0">Récord con estos ajustes (${OPTS.clef.find(o => o[0] === S.clef)[1]}, ${S.level === "easy" ? "dentro del pentagrama" : "con líneas adicionales"}): <b class="num">${rec ? rec + " notas" : "todavía ninguno"}</b></p>
      <div class="center"><button class="btn big" type="button" id="btn-go">Empezar</button></div>`;
    stage.querySelector("#btn-go").addEventListener("click", go);
    keyHandler = e => { if (e.key === "Enter") go(); };
  }
  function go() {
    score = 0; misses = 0; missed = {}; running = true; t0 = performance.now();
    stage.innerHTML = `
      <div class="stage-head"><h2>Contrarreloj</h2><div class="stats num"><span>Notas <b id="st-score">0</b></span><span>Tiempo <b id="st-time">60</b></span></div></div>
      <div class="timer"><i id="bar" style="width:100%"></i></div>
      <div class="staffbox" id="staff"></div>
      <div class="feedback" id="fb"></div>
      ${answerButtons()}`;
    stage.querySelector(".answers").addEventListener("click", e => { const b = e.target.closest(".ans"); if (b) answer(+b.dataset.l); });
    keyHandler = e => { const k = KEYMAP[e.key.toLowerCase()]; if (k != null) answer(k); };
    next();
    timer = setInterval(tick, 100);
  }
  function tick() {
    const left = Math.max(0, LEN - (performance.now() - t0) / 1000);
    stage.querySelector("#st-time").textContent = Math.ceil(left);
    stage.querySelector("#bar").style.width = (100 * left / LEN) + "%";
    if (left <= 0) end();
  }
  function next() {
    cur = pick(); wait = false;
    stage.querySelectorAll(".ans").forEach(b => b.className = "ans");
    stage.querySelector("#staff").innerHTML = staffSVG({ clef: cur.clef, notes: [{ d: cur.d, x: 190, colored: S.color === "always", anim: true }] });
  }
  function answer(l) {
    if (!running || wait) return;
    const right = letter(cur.d), good = l === right, fb = stage.querySelector("#fb");
    record(cur, good);
    if (good) { score++; play(cur.d, .6); fb.className = "feedback ok"; fb.innerHTML = nameOf(cur.d, true); next(); }
    else {
      misses++; buzz(); t0 -= 1500; wait = true;
      const k = cur.clef + cur.d; missed[k] = (missed[k] || 0) + 1;
      stage.querySelector(`#ans-${l}`).classList.add("wrong"); stage.querySelector(`#ans-${right}`).classList.add("right");
      fb.className = "feedback bad"; fb.innerHTML = `Era ${nameOf(cur.d, true)}`;
      setTimeout(() => { if (running) next(); }, 700);
    }
    stage.querySelector("#st-score").textContent = score;
  }
  function end() {
    clearInterval(timer); running = false;
    const prev = records[recKey] || 0, isRec = score > prev;
    if (isRec) { records[recKey] = score; store.set("records", records); }
    const worst = Object.entries(missed).sort((a, b) => b[1] - a[1]).slice(0, 5);
    stage.innerHTML = `
      <div class="stage-head"><h2>¡Tiempo!</h2></div>
      <div class="big-num num">${score}</div>
      <p style="margin:0;text-align:center">${isRec ? "¡Nuevo récord!" : `Tu récord es ${prev}.`} Fallos: ${misses}.</p>
      ${worst.length ? `<div><div class="muted small" style="text-align:center">Notas que fallaste</div><div class="center">${worst.map(([k]) => {
        const c = k.startsWith("sol") ? "sol" : "fa", d = +k.slice(c.length);
        return `<div style="width:120px">${staffSVG({ clef: c, W: 120, notes: [{ d, x: 85, colored: true, label: plainName(d) + octave(d) }] })}</div>`; }).join("")}</div></div>` : ""}
      <div class="center"><button class="btn big" type="button" id="btn-again">Otra vez</button></div>`;
    stage.querySelector("#btn-again").addEventListener("click", go);
    keyHandler = e => { if (e.key === "Enter") go(); };
  }
  cleanup = () => { clearInterval(timer); running = false; };
  intro();
}

// ───────── Juego 3: Al teclado ─────────
function keyboardSVG(a, b, marks = {}) {
  // a, b: notas diatónicas (teclas blancas) de inicio y fin
  const KW = 30, KH = 130, n = b - a + 1, W = n * KW + 2;
  let s = `<svg class="kb" viewBox="0 0 ${W} ${KH + 2}" width="${Math.max(W, 300)}" role="group" aria-label="Teclado">`;
  for (let d = a; d <= b; d++) {
    const x = 1 + (d - a) * KW, m = marks[d];
    s += `<rect class="w" data-d="${d}" x="${x}" y="1" width="${KW}" height="${KH}" rx="4" ${m ? `style="fill:${m}"` : ""}/>`;
    if (letter(d) === 0) s += `<text x="${x + KW / 2}" y="${KH - 8}" font-size="10" text-anchor="middle" fill="${d === 28 ? "var(--accent)" : "#67647e"}">${S.names === "en" ? "C" : "Do"}${octave(d)}</text>`;
    if (d === 28) s += `<circle cx="${x + KW / 2}" cy="${KH - 26}" r="3.5" fill="var(--accent)"/>`;
  }
  for (let d = a; d < b; d++) {
    const l = letter(d);
    if (l === 2 || l === 6) continue;
    const x = 1 + (d - a + 1) * KW - KW * .3;
    s += `<rect class="b" x="${x}" y="1" width="${KW * .6}" height="${KH * .6}" rx="3"/>`;
  }
  return s + "</svg>";
}
function gameKeys() {
  let cur, locked = false, ok = 0, total = 0;
  const [a, b] = S.clef === "sol" ? [28, 42] : S.clef === "fa" ? [14, 28] : [14, 42];
  stage.innerHTML = `
    <div class="stage-head"><h2>Al teclado</h2><div class="stats num"><span>Aciertos <b id="st-ok">0</b> / <b id="st-total">0</b></span></div></div>
    <p class="muted small" style="margin:0">Pulsa la tecla exacta, en su octava. El punto marca el Do central (Do4).</p>
    <div class="staffbox" id="staff"></div>
    <div class="feedback" id="fb"></div>
    <div class="kbwrap" id="kb"></div>
    <div class="center" id="next" hidden><button class="btn" type="button" id="btn-next">Siguiente</button></div>`;
  const fb = stage.querySelector("#fb");
  function next() {
    cur = pick(); locked = false;
    stage.querySelector("#next").hidden = true;
    fb.className = "feedback"; fb.innerHTML = `<span class="muted">¿Dónde está en el piano?</span>`;
    stage.querySelector("#staff").innerHTML = staffSVG({ clef: cur.clef, notes: [{ d: cur.d, x: 190, colored: S.color === "always", anim: true }] });
    stage.querySelector("#kb").innerHTML = keyboardSVG(a, b);
    centerKb();
  }
  function centerKb() {
    const w = stage.querySelector("#kb"); const x = (cur.d - a + .5) * 30;
    w.scrollLeft = Math.max(0, x - w.clientWidth / 2 + (Math.random() - .5) * 120);
  }
  stage.querySelector("#kb").addEventListener("click", e => {
    const k = e.target.closest(".w"); if (!k) return;
    const d = +k.dataset.d;
    if (locked) { play(d, .8); return; }
    locked = true; total++;
    const good = d === cur.d, sameLetter = letter(d) === letter(cur.d);
    record(cur, good); play(cur.d);
    const marks = { [cur.d]: COLOR(letter(cur.d)) }; if (!good) marks[d] = "var(--bad)";
    stage.querySelector("#kb").innerHTML = keyboardSVG(a, b, marks);
    stage.querySelector("#staff").innerHTML = staffSVG({ clef: cur.clef, notes: [{ d: cur.d, x: 190, colored: true }] });
    if (good) { ok++; fb.className = "feedback ok"; fb.innerHTML = `¡Exacto! ${nameOf(cur.d, true)}`; setTimeout(() => { if (locked && cur) next(); }, 1000); }
    else {
      buzz(); fb.className = "feedback bad";
      fb.innerHTML = sameLetter
        ? `<span>Nota correcta, pero octava equivocada</span><span class="hint">Era ${nameOf(cur.d, true)} y pulsaste ${nameOf(d, true)}.</span>`
        : `<span>Era ${nameOf(cur.d, true)}</span><span class="hint">Pulsaste ${nameOf(d, true)}. La nota está ${posDesc(cur.clef, cur.d)}.</span>`;
      stage.querySelector("#next").hidden = false;
    }
    stage.querySelector("#st-ok").textContent = ok; stage.querySelector("#st-total").textContent = total;
  });
  stage.querySelector("#btn-next").addEventListener("click", next);
  keyHandler = e => { if ((e.key === "Enter" || e.key === " ") && locked && !stage.querySelector("#next").hidden) { e.preventDefault(); next(); } };
  cleanup = () => { cur = null; };
  next();
}

// ───────── Juego 4: Coloca la nota ─────────
function gamePlace() {
  let target, clef, locked = false, ok = 0, total = 0;
  stage.innerHTML = `
    <div class="stage-head"><h2>Coloca la nota</h2><div class="stats num"><span>Aciertos <b id="st-ok">0</b> / <b id="st-total">0</b></span></div></div>
    <div class="prompt" id="prompt"></div>
    <div class="staffbox" id="staff"></div>
    <div class="feedback" id="fb"><span class="muted">Toca la línea o el espacio donde va.</span></div>
    <div class="center" id="next" hidden><button class="btn" type="button" id="btn-next">Siguiente</button></div>`;
  const fb = stage.querySelector("#fb");
  function slots() {
    const [a, b] = CLEFS[clef][S.level]; let s = "";
    for (let d = a; d <= b; d++) {
      const st = d - CLEFS[clef].bottom, y = yOf(st);
      s += `<g class="slotg"><g class="ghost">${noteSVG(clef, { d, x: 190, colored: S.color === "always" })}</g><rect class="slot" data-d="${d}" x="70" y="${y - GAP / 4}" width="${300 - 76}" height="${GAP / 2}"/></g>`;
    }
    return s;
  }
  function next() {
    const n = pick(); target = letter(n.d); clef = n.clef; locked = false;
    stage.querySelector("#next").hidden = true;
    stage.querySelector("#prompt").innerHTML = `Coloca un <span style="color:${COLOR(target)}">${S.names === "en" ? LET[target] : ES[target]}</span>${S.names === "both" ? ` <span class="muted">(${LET[target]})</span>` : ""} <span class="muted small">en ${CLEFS[clef].name}</span>`;
    fb.className = "feedback"; fb.innerHTML = `<span class="muted">Toca la línea o el espacio donde va.</span>`;
    stage.querySelector("#staff").innerHTML = staffSVG({ clef, extra: slots() });
  }
  stage.querySelector("#staff").addEventListener("click", e => {
    const r = e.target.closest(".slot"); if (!r || locked) return;
    locked = true; total++;
    const d = +r.dataset.d, good = letter(d) === target;
    record({ clef, d }, good);
    const [a, b] = CLEFS[clef][S.level];
    const all = []; for (let x = a; x <= b; x++) if (letter(x) === target) all.push(x);
    if (good) {
      ok++; play(d);
      const others = all.filter(x => x !== d).map((x, i) => ({ d: x, x: 220 + i * 36, colored: true }));
      stage.querySelector("#staff").innerHTML = staffSVG({ clef, notes: [{ d, x: 160, colored: true, anim: true }, ...others] });
      fb.className = "feedback ok";
      fb.innerHTML = `<span>¡Bien! ${nameOf(d, true)}</span>${others.length ? `<span class="hint">También vale la otra ${plainName(d)} que ves a la derecha.</span>` : ""}`;
      setTimeout(() => { if (locked && clef) next(); }, others.length ? 1600 : 900);
    } else {
      buzz();
      stage.querySelector("#staff").innerHTML = staffSVG({ clef, notes: [{ d, x: 130, colored: false }, ...all.map((x, i) => ({ d: x, x: 200 + i * 36, colored: true, anim: true }))] });
      fb.className = "feedback bad";
      fb.innerHTML = `<span>Has puesto ${nameOf(d, true)}</span><span class="hint">${plainName(all[0])} va ${all.map(x => posDesc(clef, x)).join(" o ")} (en color, a la derecha).</span>`;
      stage.querySelector("#next").hidden = false;
      play(all[0]);
    }
    stage.querySelector("#st-ok").textContent = ok; stage.querySelector("#st-total").textContent = total;
  });
  stage.querySelector("#btn-next").addEventListener("click", next);
  keyHandler = e => { if ((e.key === "Enter" || e.key === " ") && locked && !stage.querySelector("#next").hidden) { e.preventDefault(); next(); } };
  cleanup = () => { clef = null; };
  next();
}

// ───────── Juego: Colores (asocia cada nota con su color) ─────────
function gameColors() {
  let mode, target, order, locked = false, ok = 0, total = 0, streak = 0, alive = true;
  const best0 = store.get("colorStreak", 0); let best = best0;
  stage.innerHTML = `
    <div class="stage-head"><h2>Colores</h2><div class="stats num"><span>Racha <b id="st-streak">0</b></span><span>Mejor <b id="st-best">${best}</b></span><span>Aciertos <b id="st-acc">–</b></span></div></div>
    <p class="muted small" style="margin:0">Cada nota tiene su color, como en tu pentagrama. Unas veces verás un color y dirás la nota; otras verás el nombre y elegirás el color.</p>
    <div id="q"></div>
    <div class="feedback" id="fb"></div>
    <div class="center" id="next" hidden><button class="btn" type="button" id="btn-next">Siguiente</button></div>`;
  const fb = stage.querySelector("#fb");
  function next() {
    locked = false; stage.querySelector("#next").hidden = true;
    let t; do { t = Math.floor(Math.random() * 7); } while (t === target);
    target = t; mode = Math.random() < .5 ? "color" : "name";
    fb.className = "feedback"; fb.innerHTML = "";
    const q = stage.querySelector("#q");
    if (mode === "color") {
      q.innerHTML = `<div class="prompt">¿Qué nota tiene este color?</div><div class="blob" style="background:${COLOR(target)}"></div>
        ${answerButtons(true)}<div class="kbd">Teclado: letras C D E F G A B o números 1 a 7</div>`;
      q.querySelector(".answers").addEventListener("click", e => { const b = e.target.closest(".ans"); if (b) answer(+b.dataset.l); });
    } else {
      order = [0, 1, 2, 3, 4, 5, 6].sort(() => Math.random() - .5);
      q.innerHTML = `<div class="prompt">¿De qué color es <span>${S.names === "en" ? LET[target] : ES[target]}</span>${S.names === "both" ? ` <span class="muted">(${LET[target]})</span>` : ""}?</div>
        <div class="swatches">${order.map(i => `<button type="button" class="sw" id="sw-${i}" data-l="${i}" style="--c:${COLOR(i)}" aria-label="Color ${i + 1}"></button>`).join("")}</div>`;
      q.querySelector(".swatches").addEventListener("click", e => { const b = e.target.closest(".sw"); if (b) answer(+b.dataset.l); });
    }
  }
  function answer(l) {
    if (locked) return; locked = true; total++;
    const good = l === target, q = stage.querySelector("#q");

    if (mode === "color") { q.querySelector(`#ans-${target}`).classList.add("right"); if (!good) q.querySelector(`#ans-${l}`).classList.add("wrong"); }
    else {
      q.querySelectorAll(".sw").forEach(b => b.textContent = S.names === "en" ? LET[b.dataset.l] : ES[b.dataset.l]);
      q.querySelector(`#sw-${target}`).classList.add("right"); if (!good) q.querySelector(`#sw-${l}`).classList.add("wrong");
    }
    const nm = `<span style="display:inline-block;width:14px;height:10px;border-radius:50%;transform:rotate(-18deg);background:${COLOR(target)}"></span> ${ES[target]} (${LET[target]})`;
    if (good) {
      ok++; streak++; if (streak > best) { best = streak; store.set("colorStreak", best); }
      fb.className = "feedback ok"; fb.innerHTML = `<span>¡Bien! ${nm} es ${COLORNAME[target]}</span>`;
      setTimeout(() => { if (alive && locked) next(); }, 900);
    } else {
      streak = 0; buzz();
      fb.className = "feedback bad"; fb.innerHTML = `<span>${nm} es ${COLORNAME[target]}</span><span class="hint">${COLORHINT[target]}</span>`;
      stage.querySelector("#next").hidden = false;
    }
    stage.querySelector("#st-streak").textContent = streak; stage.querySelector("#st-best").textContent = best;
    stage.querySelector("#st-acc").textContent = Math.round(100 * ok / total) + " %";
  }
  stage.querySelector("#btn-next").addEventListener("click", next);
  keyHandler = e => {
    if ((e.key === "Enter" || e.key === " ") && locked && !stage.querySelector("#next").hidden) { e.preventDefault(); next(); return; }
    const k = KEYMAP[e.key.toLowerCase()]; if (k != null && mode === "color") answer(k);
  };
  cleanup = () => { alive = false; };
  next();
}
const COLORNAME = ["rojo", "naranja", "amarillo", "verde claro", "azul", "morado", "rosa"];
const COLORHINT = [
  "Do, el punto de partida, en rojo como un semáforo.", "Re, naranja: justo después del rojo.", "Mi, amarillo como el sol de mediodía.",
  "Fa, verde claro, a mitad del arcoíris.", "Sol, azul como el cielo.", "La, morado.", "Si, rosa: el último antes de volver al Do rojo."];

// ───────── Juego 5: Parejas ─────────
function gamePairs() {
  let cards = [], open = [], moves = 0, found = 0, busy = false, t0 = 0, alive = true;
  cleanup = () => { alive = false; };
  const bestKey = `pairs-${S.clef}-${S.level}`;
  function deal() {
    const p = pool(), byLetter = {};
    p.forEach(n => (byLetter[letter(n.d)] = byLetter[letter(n.d)] || []).push(n));
    const letters = Object.keys(byLetter).map(Number).sort(() => Math.random() - .5).slice(0, 6);
    cards = [];
    letters.forEach(l => { const n = byLetter[l][Math.floor(Math.random() * byLetter[l].length)]; cards.push({ kind: "staff", n, l }, { kind: "name", l }); });
    cards.sort(() => Math.random() - .5);
    cards.forEach((c, i) => { c.i = i; c.up = false; c.done = false; });
    open = []; moves = 0; found = 0; busy = false; t0 = performance.now();
    render();
  }
  function face(c) {
    if (c.kind === "staff") return staffSVG({ clef: c.n.clef, W: 150, notes: [{ d: c.n.d, x: 112, colored: S.color === "always" || c.done }] });
    return `<span class="nm" style="color:${c.done ? COLOR(c.l) : "inherit"}">${S.names === "en" ? LET[c.l] : ES[c.l]}${S.names === "both" ? `<small>${LET[c.l]}</small>` : ""}</span>`;
  }
  function render() {
    const best = store.get(bestKey, null);
    stage.innerHTML = `
      <div class="stage-head"><h2>Parejas</h2><div class="stats num"><span>Intentos <b>${moves}</b></span><span>Parejas <b>${found}/6</b></span><span>Mejor <b>${best ?? "–"}</b></span></div></div>
      <p class="muted small" style="margin:0">Une cada nota del pentagrama con su nombre. Destapa dos cartas en cada turno.</p>
      <div class="pairs">${cards.map(c => `<button type="button" class="card ${c.done ? "done" : c.up ? "up" : "back"}" data-i="${c.i}" id="card-${c.i}" aria-label="${c.up || c.done ? "Carta destapada" : "Carta tapada"}">${c.up || c.done ? face(c) : "♪"}</button>`).join("")}</div>
      ${found === 6 ? `<div class="feedback ok"><span>¡Completado en ${moves} intentos y ${Math.round((performance.now() - t0) / 1000)} s!</span></div><div class="center"><button class="btn big" type="button" id="btn-again">Otra partida</button></div>` : ""}`;
    stage.querySelector(".pairs").addEventListener("click", flip);
    const again = stage.querySelector("#btn-again"); if (again) again.addEventListener("click", deal);
  }
  function flip(e) {
    const b = e.target.closest(".card"); if (!b || busy) return;
    const c = cards[+b.dataset.i]; if (c.up || c.done) return;
    c.up = true; open.push(c);
    if (c.kind === "staff") play(c.n.d, .8);
    if (open.length === 2) {
      moves++;
      const [x, y] = open, match = x.l === y.l && x.kind !== y.kind;
      const sc = [x, y].find(k => k.kind === "staff");
      if (sc) record(sc.n, match);
      if (match) { x.done = y.done = true; found++; open = []; if (found === 6) { const best = store.get(bestKey, null); if (best == null || moves < best) store.set(bestKey, moves); } render(); }
      else { busy = true; render(); setTimeout(() => { if (!alive) return; x.up = y.up = false; open = []; busy = false; render(); }, 1200); }
    } else render();
  }
  deal();
}

// ───────── Mapa y progreso ─────────
function gameMap() {
  const accColor = k => { const v = stats[k]; if (!v || v[0] + v[1] === 0) return "var(--muted)"; const r = v[0] / (v[0] + v[1]); return r >= .85 ? "var(--ok)" : r >= .6 ? "var(--n1)" : "var(--bad)"; };
  const accTxt = k => { const v = stats[k]; if (!v || v[0] + v[1] === 0) return "–"; return Math.round(100 * v[0] / (v[0] + v[1])) + "%"; };
  function bigStaff(clef) {
    const [a, b] = CLEFS[clef].full, n = b - a + 1, W = 96 + n * 36;
    const notes = []; let extra = "";
    for (let d = a; d <= b; d++) {
      const x = 104 + (d - a) * 36;
      notes.push({ d, x, colored: true, octNum: true, label: S.names === "en" ? LET[letter(d)] : ES[letter(d)] });
      extra += `<rect data-d="${d}" class="slot" x="${x - 18}" y="0" width="36" height="${H}"/>`;
      extra += `<text x="${x}" y="14" font-size="10" text-anchor="middle" font-weight="700" fill="${accColor(clef + d)}">${accTxt(clef + d)}</text>`;
    }
    return `<div class="scroll"><svg class="staff wide" viewBox="0 0 ${W} ${H}" style="min-width:${Math.round(W * 1.05)}px" role="img" aria-label="Mapa de notas en ${CLEFS[clef].name}">` +
      staffSVG({ clef, W, notes }).replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "") + extra + `</svg></div>`;
  }
  const totals = Object.values(stats).reduce((a, v) => [a[0] + v[0], a[1] + v[1]], [0, 0]);
  stage.innerHTML = `
    <div class="stage-head"><h2>Mapa y progreso</h2><div class="stats num"><span>Respuestas <b>${totals[0] + totals[1]}</b></span><span>Aciertos <b>${totals[0] + totals[1] ? Math.round(100 * totals[0] / (totals[0] + totals[1])) + " %" : "–"}</b></span></div></div>
    <p class="muted small" style="margin:0">Tu pentagrama de referencia. Toca una nota para oírla. Encima de cada nota ves tu porcentaje de aciertos: <span style="color:var(--ok);font-weight:700">verde</span> dominada, <span style="color:var(--n1);font-weight:700">naranja</span> casi, <span style="color:var(--bad);font-weight:700">rojo</span> a repasar. El número dentro de cada Do dice qué Do del piano es: el Do4 es el Do central, el Do3 está una octava más abajo y el Do5 una más arriba.</p>
    <div class="legend">${ES.map((n, i) => `<span><i style="background:${COLOR(i)}"></i>${n} (${LET[i]})</span>`).join("")}</div>
    <h3 style="font-family:var(--font-display)">Clave de Sol (mano derecha) · Do4 a Do6</h3>
    ${bigStaff("sol")}
    <h3 style="font-family:var(--font-display)">Clave de Fa (mano izquierda) · Do2 a Do4</h3>
    ${bigStaff("fa")}
    <div class="mnemo">
      <div><b>Sol · líneas (abajo a arriba)</b>Mi, Sol, Si, Re, Fa</div>
      <div><b>Sol · espacios</b>Fa, La, Do, Mi (deletrean «FA-LA-DO-MI»)</div>
      <div><b>Fa · líneas</b>Sol, Si, Re, Fa, La</div>
      <div><b>Fa · espacios</b>La, Do, Mi, Sol</div>
      <div><b>Truco de las claves</b>La clave de Sol se enrosca en la 2.ª línea, que es Sol. Los dos puntos de la clave de Fa rodean la 4.ª línea, que es Fa.</div>
      <div><b>Do central (Do4)</b>Es la misma tecla en las dos claves: una línea adicional debajo de la clave de Sol y una encima de la clave de Fa.</div>
    </div>
    <div class="confirm" id="reset"><button class="btn soft" type="button" id="btn-reset">Borrar mi progreso</button></div>`;
  stage.querySelectorAll(".scroll").forEach(s => s.addEventListener("click", e => { const r = e.target.closest("[data-d]"); if (r) play(+r.dataset.d); }));
  stage.querySelector("#btn-reset").addEventListener("click", () => {
    const box = stage.querySelector("#reset");
    box.innerHTML = `<span>¿Borrar aciertos, rachas y récords?</span><button class="btn" type="button" id="btn-yes" style="background:var(--bad)">Sí, borrar</button><button class="btn soft" type="button" id="btn-no">Cancelar</button>`;
    box.querySelector("#btn-yes").addEventListener("click", () => {
      stats = {}; records = {}; store.set("stats", {}); store.set("records", {}); store.set("streak", 0);
      ["sol", "fa", "ambas"].forEach(c => ["easy", "full"].forEach(l => store.set(`pairs-${c}-${l}`, null)));
      gameMap();
    });
    box.querySelector("#btn-no").addEventListener("click", gameMap);
  });
}

renderSettings(); renderTabs(); startGame();
// Redibuja al cargar la fuente musical (las claves usan Noto Music)
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.game === "mapa") gameMap(); });
</script>
