<title>Piano Curso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: app de una columna (máx. 720px) con barra de pestañas fija abajo; cada ruta con su degradado */
:root {
  --bg: #f4f3fb; --surface: #ffffff; --surface-2: #ecebf6; --fg: #1d1b2e; --muted: #67647e; --line: #d9d7ea;
  --accent: #5856d6; --ok: #2fb35a; --warn: #ff9500; --key-white: #ffffff; --key-black: #1d1b2e; --key-line: #2b2940;
  --shadow: 0 8px 24px rgba(40, 30, 90, .12);
  --font-display: "Nunito", "SF Pro Rounded", ui-rounded, system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-music: "Noto Music", "Bravura", "Apple Symbols", "Segoe UI Symbol", serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13121c; --surface: #1e1d2b; --surface-2: #2a2939; --fg: #f1f0fa; --muted: #a5a2bd; --line: #3a384e;
  --accent: #8e8cf5; --ok: #45d070; --warn: #ffb340; --key-white: #f4f3f8; --key-black: #0b0a12; --key-line: #0b0a12;
  --shadow: 0 8px 24px rgba(0, 0, 0, .4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13121c; --surface: #1e1d2b; --surface-2: #2a2939; --fg: #f1f0fa; --muted: #a5a2bd; --line: #3a384e;
  --accent: #8e8cf5; --ok: #45d070; --warn: #ffb340; --key-white: #f4f3f8; --key-black: #0b0a12; --key-line: #0b0a12;
  --shadow: 0 8px 24px rgba(0, 0, 0, .4); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2.1rem; font-weight: 900; }
h2 { font-size: 1.4rem; font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 800; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.tiny { font-size: .74rem; }

main { max-width: 720px; margin: 0 auto; padding-block: 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.back { border: 0; background: var(--surface-2); border-radius: 999px; padding: 6px 14px; font-weight: 600; }
.topbar h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Pestañas */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
nav.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: .74rem; font-weight: 600; }
nav.tabs a svg { width: 24px; height: 24px; }
nav.tabs a.on { color: var(--accent); }

/* Superficies */
.card { border-radius: 20px; padding: 16px; background: color-mix(in srgb, var(--tint, var(--accent)) 11%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--tint, var(--accent)) 28%, transparent); }
.plain { border-radius: 18px; padding: 16px; background: var(--surface); border: 1px solid var(--line); }
.grad { color: #fff; border-radius: 26px; padding: 20px; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 10px 26px color-mix(in srgb, var(--c1) 35%, transparent); }
.grad a, .grad .muted { color: #fff; opacity: .92; }
.badge { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: linear-gradient(160deg, color-mix(in srgb, var(--tint) 80%, #fff), var(--tint)); }
.badge svg { width: 22px; height: 22px; }
.pill { display: inline-block; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--tint, var(--accent)) 20%, transparent); color: var(--tint, var(--accent)); }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; background: var(--tint, var(--accent)); color: #fff; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn.soft { background: color-mix(in srgb, var(--tint, var(--accent)) 14%, var(--surface)); color: var(--tint, var(--accent)); }
.btn.big { padding: 14px 24px; font-size: 1.05rem; border-radius: 14px; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: .45; cursor: default; }
.round { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--tint); color: #fff; }
.round svg { width: 18px; height: 18px; }
.bar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--tint, var(--accent)) 18%, var(--surface-2)); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--tint, var(--accent)); }
.grad .bar { background: rgba(255,255,255,.3); } .grad .bar > i { background: #fff; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 7px 6px; font-weight: 600; font-size: .88rem; }
.seg button.on { background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.12); color: var(--accent); }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
label.toggle { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
label.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

/* Hoy */
.hero { display: flex; flex-direction: column; gap: 12px; }
.hero .logo { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,.25); object-fit: cover; background: #fff; }
.hero .mins { font-family: var(--font-display); font-size: 3.3rem; font-weight: 900; line-height: 1; }
input[type=range] { width: 100%; accent-color: #fff; }
.slider-row { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.block { display: flex; gap: 14px; align-items: flex-start; }
.block .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.block a.lesson { font-weight: 600; color: var(--tint); text-decoration: none; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { border-radius: 18px; padding: 12px 8px; text-align: center; background: color-mix(in srgb, var(--tint) 12%, var(--surface)); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tile b { font-family: var(--font-display); font-size: 1.5rem; }
.tile svg { width: 24px; height: 24px; color: var(--tint); }

/* Curso */
.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.stile { text-decoration: none; min-height: 168px; display: flex; flex-direction: column; gap: 6px; border-radius: 22px; padding: 16px; }
.stile svg.ic { width: 34px; height: 34px; }
.stile .grow { flex: 1; }
.chordlink { text-decoration: none; display: flex; align-items: center; gap: 14px; background: linear-gradient(90deg, #5856d6, #ff2d55); border-radius: 20px; padding: 16px; color: #fff; }
.chordlink svg { width: 30px; height: 30px; flex: none; }
.milestone { display: flex; gap: 14px; align-items: center; padding-block: 10px; }
.milestone .n { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 1.2rem; background: linear-gradient(135deg, var(--c1), var(--c2)); border: 3px solid var(--surface); box-shadow: 0 2px 8px color-mix(in srgb, var(--c1) 45%, transparent); }
.road { display: flex; gap: 14px; text-decoration: none; color: inherit; }
.road .rail { width: 44px; flex: none; display: flex; flex-direction: column; align-items: center; }
.road .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.road .dot svg { width: 15px; height: 15px; }
.road .line { width: 4px; flex: 1; border-radius: 2px; }
.road .lcard { flex: 1; min-width: 0; margin-bottom: 12px; border-radius: 16px; padding: 14px; background: var(--surface); border: 2px solid transparent; display: flex; flex-direction: column; gap: 5px; }
.road.next .lcard { border-color: var(--c1); background: color-mix(in srgb, var(--c1) 13%, var(--surface)); }
.road.done .lcard { opacity: .75; }
.meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: .74rem; color: var(--muted); }

/* Lección */
.step { display: flex; gap: 12px; align-items: flex-start; border: 0; background: transparent; text-align: left; padding: 8px 4px; width: 100%; border-radius: 10px; }
.step:hover { background: var(--surface-2); }
.step .k { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .8rem; background: var(--c1); }
.step.on .k { background: var(--ok); }
.step.on span { text-decoration: line-through; color: var(--muted); }
.section-title { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); }
.score { display: flex; flex-direction: column; gap: 4px; padding-block: 10px; border-top: 1px solid var(--line); }
.score:first-of-type { border-top: 0; }
.score .links { display: flex; gap: 16px; font-weight: 700; font-size: .85rem; }
.warnnote { font-size: .8rem; color: var(--warn); font-weight: 600; }
textarea.xml { width: 100%; height: 140px; font-family: ui-monospace, Menlo, monospace; font-size: .72rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); padding: 8px; }

/* Acordes */
.chord { border: 0; text-align: left; width: 100%; border-radius: 14px; padding: 10px; background: color-mix(in srgb, var(--tint) 9%, var(--surface)); display: flex; flex-direction: column; gap: 6px; }
.chord .hd { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.chord .hd b { font-family: var(--font-display); font-size: 1.2rem; }
.chord .hd span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chord svg.kb { width: 100%; max-width: 440px; height: auto; display: block; border-radius: 4px; }
.chordgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chips button { flex: none; border: 0; border-radius: 999px; padding: 6px 13px; font-weight: 700; background: color-mix(in srgb, #5856d6 13%, var(--surface)); color: var(--accent); }
.chips button.on { background: #5856d6; color: #fff; }

/* Solfeo */
.menu a { display: flex; align-items: center; gap: 12px; padding: 10px 4px; text-decoration: none; color: inherit; border-top: 1px solid var(--line); }
.menu a:first-of-type { border-top: 0; }
.menu .badge { width: 34px; height: 34px; } .menu .badge svg { width: 17px; height: 17px; }
.keyboard { position: relative; height: 200px; display: flex; user-select: none; touch-action: manipulation; }
.keyboard .w { flex: 1; border: 1px solid var(--key-line); background: var(--key-white); color: #1d1b2e; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: .72rem; font-weight: 600; text-align: center; border-radius: 0 0 6px 6px; line-height: 1.1; }
.keyboard .w:active, .keyboard .w.hit { background: #d7f5df; }
.keyboard .w.miss { background: #ffd9d6; }
.keyboard .b { position: absolute; top: 0; height: 60%; background: var(--key-black); border: 0; border-radius: 0 0 5px 5px; z-index: 2; }
.keyboard .b:active { background: #4a4766; }
.msg { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; text-align: center; min-height: 60px; display: grid; place-items: center; }
svg.staff { width: 100%; height: 220px; display: block; color: var(--fg); }
.answers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.answers button, .ivs button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 44px; font-weight: 700; }
.answers button:hover, .ivs button:hover { border-color: var(--accent); }
.ivs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ivs button { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; }

/* Progreso */
.sum { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 8px; }
.sum b { display: block; font-family: var(--font-display); font-size: 1.6rem; }
.sess { display: flex; gap: 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.sess:first-child { border-top: 0; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; padding: 4px 8px; border-radius: 8px; }
.x:hover { background: var(--surface-2); color: #ff3b30; }

/* Práctica (hoja modal) */
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(10, 8, 25, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet .pane { width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
@media (min-width: 560px) { .sheet { align-items: center; } .sheet .pane { border-radius: 24px; } }
.ring { width: 220px; height: 220px; margin: 0 auto; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; align-content: center; }
.ring .t b { font-family: var(--font-display); font-size: 3rem; font-variant-numeric: tabular-nums; }
.beats { display: flex; gap: 10px; justify-content: center; }
.beats i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.beats i.on { background: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 20px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
@media (max-width: 420px) { h1 { font-size: 1.8rem; } .hero .mins { font-size: 2.8rem; } .answers { grid-template-columns: repeat(4, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const KEY = "pianocurso.v1";

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign({}, DEFAULT_STATE, JSON.parse(raw)); } catch (e) {}

let cloudRef = null, cloudTimer = null;

  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}

}
async function connectCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.collection("data/users/" + id).doc("progreso");
    const snap = await ref.get();
    if (snap.exists && snap.data().state) {
      const remote = JSON.parse(snap.data().state);

const totalMinutes = () => S.sessions.reduce((a, s) => a + s.minutes, 0);

// ───────────────────────────── Planificador diario ─────────────────────────────
const MIN_MIN = 15, MAX_MIN = 60, DAYS_PER_WEEK = 5;
function split(minutes) {
  const m = Math.min(Math.max(minutes, MIN_MIN), MAX_MIN);
  const solfeo = m < 20 ? Math.round(m * .25) : Math.floor(m * .25);
  const libre = m < 20 ? 0 : Math.round(m * .12);
  return { solfeo, tecnica: solfeo, repertorio: m - 2 * solfeo - libre, libre };
}
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
// Lunes clásica, martes blues, miércoles pop, jueves clásica, viernes jazz o rock (semanas alternas), fin de semana tu favorito.
function dayStyle(date, level, favorite) {
  if (level === 0) return "fundamentos";
  const wd = date.getDay(); // 0 = domingo
  let s;
  if (wd === 1 || wd === 4) s = "clasica";
  else if (wd === 2) s = "blues";
  else if (wd === 3) s = "pop";
  else if (wd === 5) s = isoWeek(date) % 2 === 0 ? "jazz" : "rock";
  else s = favorite === "fundamentos" ? "clasica" : favorite;
  if (s === "jazz" && level === 1) s = "rock";
  return s;
}
function nextLesson(style, level, kind) {
  const list = lessonsOf(style, level, kind);
  return list.find(l => !isDone(l.id)) || list[0] || null;
}
function plan(date = new Date()) {
  const sp = split(S.minutes), lvl = S.level;
  const style = dayStyle(date, lvl, S.favorite);
  const rep = nextLesson(style, lvl, "partitura") || nextLesson("fundamentos", lvl, "partitura");
  const blocks = [
    { kind: "solfeo", minutes: sp.solfeo, lesson: nextLesson("fundamentos", lvl, "solfeo"), note: "Termina con unos minutos del quiz de lectura." },
    { kind: "tecnica", minutes: sp.tecnica, lesson: nextLesson("fundamentos", lvl, "tecnica"), note: "Siempre con metrónomo y lento." },
    { kind: "repertorio", minutes: sp.repertorio, lesson: rep, note: `Estilo del día: ${STYLES[style].name}.` },
  ];
  if (sp.libre > 0) blocks.push({ kind: "libre", minutes: sp.libre, lesson: null,
    note: lvl === 0 ? "Toca lo que quieras con las teclas negras: ¡todo suena bien!" : "Improvisa con lo aprendido o toca algo que ya te salga bien." });
  return { style, blocks };
}

const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${x.getMonth() + 1}-${x.getDate()}`; };

  const days = new Set([...S.sessions.map(s => dayKey(s.date)), ...Object.values(S.completed).map(dayKey)]);

const STEPS = ["C", "D", "E", "F", "G", "A", "B"], SOLFEGE = ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si"], SEMI = [0, 2, 4, 5, 7, 9, 11];

// ───────────────────────────── Acordes (tu tabla: 12 tipos × 12 notas) ─────────────────────────────
const QUALITIES = [
  ["", "Mayor", "Acorde de 3 notas", [0, 4, 7], "4+3"], ["m", "Menor", "Acorde de 3 notas", [0, 3, 7], "3+4"],
  ["5dim", "5ª disminuida", "Acorde de 3 notas", [0, 3, 6], "3+3"], ["+", "Aumentado", "Acorde de 3 notas", [0, 4, 8], "4+4"],
  ["6", "Mayor con 6ª", "Acorde con 6ª", [0, 4, 7, 9], "4+3+2"], ["m6", "Menor con 6ª", "Acorde con 6ª", [0, 3, 7, 9], "3+4+2"],
  ["7", "7ª dominante", "Acorde de 7ª", [0, 4, 7, 10], "4+3+3"], ["m7", "7ª menor", "Acorde de 7ª", [0, 3, 7, 10], "3+4+3"],
  ["maj7", "7ª mayor", "Acorde de 7ª", [0, 4, 7, 11], "4+3+4"], ["dim7", "7ª disminuida", "Acorde de 7ª", [0, 3, 6, 9], "3+3+3"],
  ["9", "9ª dominante", "Acorde de 9ª", [0, 4, 7, 10, 14], "4+3+3+4"], ["7-9", "7ª con 9ª bemol", "Acorde de 9ª", [0, 4, 7, 10, 13], "4+3+3+3"],

const ROOT_SYM = ["C", "D♭", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
const ROOT_ES = ["Do", "Re♭", "Re", "Mi♭", "Mi", "Fa", "Fa♯", "Sol", "La♭", "La", "Si♭", "Si"];
function chordFrom(root, q) { return { root, q, symbol: ROOT_SYM[root] + q.id, es: `${ROOT_ES[root]} · ${q.name}`, midi: q.intervals.map(i => 60 + root + i) }; }

}
const WHITE_PC = new Set([0, 2, 4, 5, 7, 9, 11]);
const LETTER = { 0: "C", 2: "D", 4: "E", 5: "F", 7: "G", 9: "A", 11: "B" };
function chordSVG(ch, color, compact) {
  const top = Math.max(77, Math.max(...ch.midi) + 1);
  const whites = []; for (let m = 59; m <= top; m++) if (WHITE_PC.has(m % 12)) whites.push(m);
  const w = 20, h = compact ? 70 : 96, notes = new Set(ch.midi);
  let s = `<svg class="kb" viewBox="0 0 ${whites.length * w} ${h}" role="img" aria-label="Teclado con ${ch.symbol}">`;
  whites.forEach((m, i) => {
    s += `<rect x="${i * w}" y="0" width="${w}" height="${h}" fill="#fff" stroke="#2b2940" stroke-width=".8"/>`;
    if (notes.has(m)) s += `<circle cx="${i * w + w / 2}" cy="${h - 26}" r="6" fill="${color}"/>`;
    s += `<text x="${i * w + w / 2}" y="${h - 6}" font-size="9" text-anchor="middle" font-family="Inter, sans-serif" fill="${m % 12 === 0 ? "#e0302a" : "#555"}" font-weight="${m % 12 === 0 ? 700 : 500}">${LETTER[m % 12]}</text>`;
  });
  whites.forEach((m, i) => {
    if (i < whites.length - 1 && !WHITE_PC.has((m + 1) % 12)) {
      const x = (i + 1) * w - w * .3;

      if (notes.has(m + 1)) s += `<circle cx="${x + w * .3}" cy="${h * .6 - 8}" r="4.2" fill="#fff"/>`;

function chordCard(ch, color, compact) {
  return `<button class="chord" style="--tint:${color}" data-chord="${ch.midi.join(",")}">
    <div class="hd"><b>${ch.symbol}</b><span class="small muted">${ch.es}</span><span class="spacer"></span>${icon("speaker", 16, color)}</div>
    ${chordSVG(ch, color, compact)}
    ${compact ? "" : `<div class="tiny muted">Notas: ${ch.midi.map(m => ROOT_ES[m % 12]).join(" – ")} · fórmula ${ch.q.formula}</div>`}
  </button>`;
}

let AC = null, master = null;
function ac() {

  g.gain.setTargetAtTime(0.0001, when + .25, decay / 3);
  g.gain.setTargetAtTime(0, when + dur, .08);
  [[1, 1, "triangle"], [2, .35, "sine"], [3, .12, "sine"], [4, .06, "sine"]].forEach(([mul, amp, type]) => {

function click(accent, when) {
  const c = ac(), o = c.createOscillator(), g = c.createGain();

function stopExercise() { if (exTimer) { clearTimeout(exTimer); exTimer = null; } if (AC && master) { master.disconnect(); master = AC.createDynamicsCompressor(); master.connect(AC.destination); } if (exStopHandler) { const h = exStopHandler; exStopHandler = null; h(); } }
function playExercise(ex, tempo, onEnd) {
  stopExercise();
  const c = ac(), six = 60 / Math.max(tempo, 20) / 4; let t = c.currentTime + .08;
  for (const bar of measures(ex)) for (const ev of bar) { ev.pitches.forEach(p => tone(midiOf(p), t, six * ev.duration * .95, .75)); t += six * ev.duration; }
  exStopHandler = onEnd;
  exTimer = setTimeout(() => { exTimer = null; const h = exStopHandler; exStopHandler = null; h && h(); }, (t - c.currentTime) * 1000);
}

}
function staffSVG(p, clef) {
  const W = 340, H = 200, gap = 16, bottom = H / 2 + gap * 2, left = 8, right = W - 8;
  let s = `<svg class="staff" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pentagrama en ${clefName(clef)}">`;
  for (let i = 0; i < 5; i++) s += `<line x1="${left}" x2="${right}" y1="${bottom - i * gap}" y2="${bottom - i * gap}" stroke="currentColor" stroke-width="1.4"/>`;
  s += clef === "treble"
    ? `<text x="${left + 8}" y="${bottom + gap * .55}" font-size="${gap * 6.2}" fill="currentColor" font-family='"Noto Music","Bravura","Apple Symbols","Segoe UI Symbol",serif'>𝄞</text>`
    : `<text x="${left + 10}" y="${bottom - gap * 1.05}" font-size="${gap * 3.6}" fill="currentColor" font-family='"Noto Music","Bravura","Apple Symbols","Segoe UI Symbol",serif'>𝄢</text>`;
  if (p) {
    const base = clef === "treble" ? diatonic({ step: "E", octave: 4 }) : diatonic({ step: "G", octave: 2 });
    const pos = diatonic(p) - base, x = W * .6, y = bottom - pos * gap / 2;
    const ledgers = [];
    if (pos <= -2) for (let l = -2; l >= pos; l -= 2) ledgers.push(l);
    if (pos >= 10) for (let l = 10; l <= pos; l += 2) ledgers.push(l);
    ledgers.forEach(l => s += `<line x1="${x - gap * 1.3}" x2="${x + gap * 1.3}" y1="${bottom - l * gap / 2}" y2="${bottom - l * gap / 2}" stroke="currentColor" stroke-width="1.4"/>`);
    s += `<ellipse cx="${x}" cy="${y}" rx="${gap * .78}" ry="${gap * .52}" fill="none" stroke="currentColor" stroke-width="2.6" transform="rotate(-18 ${x} ${y})"/>`;
  }
  return s + "</svg>";
}
function viewReading(clef) {
  const RANGES = ["Fase 0", "Nivel 1", "Completo"];
  let range = 0, current = null, correct = 0, total = 0, feedback = "", english = false, streakN = 0;
  const pool = () => {
    const c = clef === "treble" ? diatonic({ step: "C", octave: 4 }) : diatonic({ step: "C", octave: 3 });
    const [a, b] = range === 0 ? [0, 4] : range === 1 ? (clef === "treble" ? [-1, 12] : [-5, 7]) : (clef === "treble" ? [-3, 16] : [-7, 10]);
    const out = []; for (let i = a; i <= b; i++) out.push(fromDiatonic(c + i)); return out;
  };
  const next = () => { const p = pool(); let c; do { c = p[Math.floor(Math.random() * p.length)]; } while (p.length > 1 && current && diatonic(c) === diatonic(current)); current = c; };
  const draw = () => {
    app.innerHTML = topbar(clefName(clef), "solfeo") + `
    <div class="seg" role="group" aria-label="Rango">${RANGES.map((r, i) => `<button data-r="${i}" class="${i === range ? "on" : ""}">${r}</button>`).join("")}</div>
    <div class="plain">${staffSVG(current, clef)}</div>
    <div class="msg" style="min-height:30px;font-size:1.15rem">${feedback}</div>
    <div class="answers">${STEPS.map((st, i) => `<button data-a="${i}">${english ? st : SOLFEGE[i]}</button>`).join("")}</div>
    <label class="toggle plain" for="eng">Nombres en inglés (C, D, E…) <input id="eng" type="checkbox" ${english ? "checked" : ""}></label>
    <div class="small muted num" style="text-align:center">Aciertos ${correct}/${total} · racha ${streakN} · mejor racha ${S.bestReadStreak}</div>`;
    app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { range = +b.dataset.r; next(); draw(); });
    document.getElementById("eng").onchange = e => { english = e.target.checked; draw(); };
    app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
      total++; playMidi([midiOf(current)]);
      if (stepIndex(current) === +b.dataset.a) { correct++; streakN++; if (streakN > S.bestReadStreak) { S.bestReadStreak = streakN; save(); } feedback = `<span style="color:var(--ok)">✓ ${solfegeName(current)}</span>`; }
      else { streakN = 0; feedback = `<span style="color:#ff3b30">✗ Era ${solfegeName(current)} (${englishName(current)})</span>`; }
      next(); draw();
    });
  };
  next(); draw();
}
function viewIntervals() {

    const ls = lessonsOf(id), c = ls.filter(l => isDone(l.id)).length;
    return `<div class="stack" style="gap:4px;--tint:${STYLES[id].c1}"><div class="row"><span style="color:${STYLES[id].c1};display:flex">${icon(STYLES[id].icon, 18)}</span><span>${STYLES[id].name}</span><span class="spacer"></span><span class="num muted">${c}/${ls.length}</span></div><div class="bar"><i style="width:${c / ls.length * 100}%"></i></div></div>`;
  }).join("")}</section>
  <div class="section-title">Últimas sesiones</div>
  <section class="plain">${sessions.length ? sessions.map(s => `<div class="sess"><div style="flex:1;min-width:0"><div>${esc(s.note || "Práctica")}</div><div class="tiny muted">${df.format(new Date(s.date))}</div></div><span class="num">${s.minutes} min</span><button class="x" data-del="${s.i}" aria-label="Borrar sesión">×</button></div>`).join("")
    : `<div class="muted">Todavía no hay sesiones. Empieza desde la pestaña Hoy.</div>`}</section>
  <div class="section-title">Copia de seguridad</div>
  <section class="plain stack">
    <div class="small muted">Tu progreso se guarda solo en este navegador. Copia el texto para guardarlo o pásalo a otro dispositivo, y pégalo allí con «Restaurar».</div>
    <div class="row wrap"><button class="btn soft" id="bk-copy">${icon("copy", 18)} Copiar mi progreso</button><button class="btn soft" id="bk-restore">Restaurar…</button></div>
    <div id="bk-area" hidden class="stack"><textarea class="xml" id="bk-text" aria-label="Datos de progreso"></textarea><div class="row"><button class="btn" id="bk-apply">Restaurar este progreso</button><span class="tiny muted" id="bk-msg"></span></div></div>
  </section>`;
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    if (b.dataset.armed) { S.sessions.splice(+b.dataset.del, 1); save(); viewProgress(); }
    else { b.dataset.armed = 1; b.textContent = "Borrar"; b.style.color = "#ff3b30"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "×"; b.style.color = ""; } }, 3000); }
  });
  const area = document.getElementById("bk-area"), ta = document.getElementById("bk-text");
  document.getElementById("bk-copy").onclick = async () => {
    const t = JSON.stringify(S); area.hidden = false; ta.value = t;
    try { await navigator.clipboard.writeText(t); toast("Progreso copiado"); } catch (e) { ta.focus(); ta.select(); toast("Selecciona el texto y cópialo"); }
  };
  document.getElementById("bk-restore").onclick = () => { area.hidden = false; ta.value = ""; ta.focus(); };
  document.getElementById("bk-apply").onclick = () => {
    try { const d = JSON.parse(ta.value); if (!Array.isArray(d.sessions) || typeof d.completed !== "object") throw 0; S = Object.assign({}, DEFAULT_STATE, d); save(); toast("Progreso restaurado"); viewProgress(); }
    catch (e) { document.getElementById("bk-msg").textContent = "Ese texto no es una copia de Piano Curso. Pega el texto completo que copiaste."; }
  };
}

// ───────────────────────────── Cronómetro + metrónomo ─────────────────────────────
function openPractice(lesson, target, title) {
  const root = document.getElementById("sheet-root");
  let elapsedBefore = 0, startedAt = null, metroOn = false, bpm = 60, beat = 0, tick = null, sched = null, nextT = 0, wake = null;
  const elapsed = () => Math.floor(elapsedBefore + (startedAt ? (Date.now() - startedAt) / 1000 : 0));
  root.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Práctica"><div class="pane">
    <div class="row"><button class="back" id="pr-close">Cerrar</button><span class="spacer"></span><b>Práctica</b><span class="spacer"></span><button class="btn" id="pr-save" disabled>Guardar</button></div>
    <h3 style="text-align:center">${esc(title)}</h3>
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--surface-2)" stroke-width="7"/><circle id="pr-arc" cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg>
      <div class="t"><b id="pr-time">00:00</b><span class="tiny muted">objetivo ${target} min</span></div></div>
    <div class="row" style="justify-content:center"><button class="btn big" id="pr-go">${icon("play", 18)} Empezar</button></div>
    <section class="plain stack"><b>Metrónomo</b>
      <label class="toggle" for="pr-metro">Activado <input id="pr-metro" type="checkbox"></label>
      <div class="row"><span class="num" style="width:80px;font-weight:600" id="pr-bpm">60 bpm</span><input id="pr-bpm-r" type="range" min="40" max="200" step="1" value="60" style="accent-color:var(--accent)" aria-label="Pulsaciones por minuto"></div>
      <div class="beats" id="pr-beats"><i></i><i></i><i></i><i></i></div>
    </section></div></div>`;
  const $ = id => document.getElementById(id);
  const paint = () => {
    const e = elapsed(); $("pr-time").textContent = `${String(Math.floor(e / 60)).padStart(2, "0")}:${String(e % 60).padStart(2, "0")}`;
    $("pr-arc").setAttribute("stroke-dashoffset", 276.5 * (1 - Math.min(e / Math.max(target * 60, 1), 1)));
    $("pr-save").disabled = e < 30;
  };
  const beats = () => $("pr-beats").querySelectorAll("i").forEach((b, i) => b.classList.toggle("on", metroOn && i === beat));
  const startMetro = () => {
    clearInterval(sched); if (!metroOn) { beats(); return; }
    const c = ac(); nextT = c.currentTime + .05; let n = 0;
    sched = setInterval(() => {
      while (nextT < c.currentTime + .12) {
        const b = n % 4, when = nextT; click(b === 0, when);
        setTimeout(() => { beat = b; beats(); }, Math.max(0, (when - c.currentTime) * 1000));
        n++; nextT += 60 / bpm;
      }
    }, 25);
  };
  $("pr-go").onclick = () => {
    if (startedAt) { elapsedBefore += (Date.now() - startedAt) / 1000; startedAt = null; clearInterval(tick); $("pr-go").innerHTML = `${icon("play", 18)} Seguir`; }
    else { startedAt = Date.now(); tick = setInterval(paint, 250); $("pr-go").innerHTML = `${icon("pause", 18)} Pausa`;
      try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wake = w).catch(() => {}); } catch (e) {} }
    paint();
  };
  $("pr-metro").onchange = e => { metroOn = e.target.checked; startMetro(); };
  $("pr-bpm-r").oninput = e => { bpm = +e.target.value; $("pr-bpm").textContent = `${bpm} bpm`; };
  const close = () => { clearInterval(tick); clearInterval(sched); try { wake && wake.release(); } catch (e) {} root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  $("pr-close").onclick = close;
  root.querySelector(".sheet").onclick = e => { if (e.target.classList.contains("sheet")) close(); };
  $("pr-save").onclick = () => {
    const minutes = Math.max(1, Math.round(elapsed() / 60));
    S.sessions.push({ date: new Date().toISOString(), minutes, lessonID: lesson ? lesson.id : null, note: title }); save();
    close(); toast(`Guardados ${minutes} min de práctica`); route();
  };
  $("pr-go").focus();
}

route();
connectCloud();
</script>
